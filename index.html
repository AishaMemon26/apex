<style>

/* page hero */
.phero{background:linear-gradient(160deg,var(--navy),#0b335a);color:#fff;padding:clamp(44px,6vw,80px) 0}

.crumbs{font-size:.85rem;color:#9db8d1;margin-bottom:14px}.crumbs a{text-decoration:none}.crumbs a:hover{color:#fff}

.grid{display:grid;gap:24px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}

.fbot{border-top:1px solid rgba(255,255,255,.1);margin-top:48px;padding-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.85rem}
#wa{position:fixed;right:18px;bottom:18px;z-index:90;width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .2s}#wa:hover{transform:scale(1.07)}#wa svg{width:30px;height:30px}
#cookie{position:fixed;left:16px;right:16px;bottom:16px;z-index:150;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:18px 20px;display:none}
#cookie.show{display:block}#cookie p{font-size:.88rem;color:var(--muted);margin:0 0 12px}#cookie .row{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;z-index:300;opacity:0;pointer-events:none;transition:.3s;max-width:92vw;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#b42323}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.reveal.in-view{opacity:1;transform:none}

.adm{background:var(--light);min-height:70vh;padding:32px 0 80px}
.adm-login{max-width:440px;margin:48px auto;padding:32px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs button{font:inherit;font-weight:600;font-size:.92rem;padding:.55rem 1rem;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.tabs button:hover{background:#fff}.tabs button.on{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}

.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:#f7fafc}

.panel{padding:24px;margin-bottom:20px}

 if(window.crypto&&crypto.subtle){let h=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
 let h1=0xdeadbeef,h2=0x41c6ce57;for(let r=0;r<2000;r++)for(let i=0;i<data.length;i++){const c=data[i];h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 return (h1>>>0).toString(16)+(h2>>>0).toString(16)}

  $('#m-x',m).onclick=closeModal;
  $('#m-save',m).onclick=async()=>{const patch={status:$('#m-status',m).value,notes:$('#m-notes',m).value};try{await Admin.call(()=>Store.updateLead(l.id,patch));Object.assign(l,patch);closeModal();Admin.view();toast('Lead updated')}catch(err){toast('Save failed: '+err.message,true)}};
  $('#m-del',m).onclick=async()=>{if(!confirm('Permanently delete this lead?'))return;try{await Admin.call(()=>Store.deleteLead(l.id));Admin.leads=Admin.leads.filter(x=>x.id!==l.id);closeModal();Admin.view();toast('Lead deleted')}catch(err){toast('Delete failed: '+err.message,true)}}},
 svcModal(id){const C=Store.content;const isNew=!id;const s=isNew?{id:uid(),slug:'',title:'',icon:'sparkle',short:'',long:'',includes:[],idealFor:[],published:true,priceFrom:'',image:''}:Object.assign({},C.services.find(x=>x.id===id));let img=s.image;
  const m=openModal('<h3>'+(isNew?'Add service':'Edit service')+'</h3><form id="mf" class="fgrid" novalidate>'+fieldHtml('Title','title',s.title,'text',{full:1})+fieldHtml('URL slug (auto if blank)','slug',s.slug)+'<div><label class="f" for="m-icon">Icon</label><select class="in" id="m-icon" name="icon">'+['home','building','box','hardhat','sparkle','key','mop','floor','spray','shield','leaf','users'].map(i=>'<option'+(i===s.icon?' selected':'')+'>'+i+'</option>').join('')+'</select></div>'+areaHtml('Short description (cards &amp; SEO)','short',s.short,2)+areaHtml('Full description','long',s.long,4)+areaHtml('What\'s included (one per line)','includes',(s.includes||[]).join('\n'),6)+areaHtml('Ideal for (one per line)','idealFor',(s.idealFor||[]).join('\n'),4)+fieldHtml('Starting price in CAD (optional, numbers only)','priceFrom',s.priceFrom,'text')+'<div><label class="f">Image (optional)</label><input type="file" accept="image/*" id="m-img"><div class="note" id="m-imgnote">'+(img?'Image set. ':'')+'<a href="#" id="m-imgclr">Remove</a></div></div>'+chk('Published (visible on website)','published',s.published!==false)+'<div class="full" style="display:flex;gap:8px"><button class="btn btn-primary" type="submit">Save</button><button class="btn btn-outline" type="button" id="m-x">Cancel</button></div></form>');
  $('#m-x',m).onclick=closeModal;$('#m-img',m).onchange=async e=>{try{img=await readImage(e.target.files[0],1200);$('#m-imgnote',m).textContent='Image ready (save to apply).'}catch(err){toast(err.message,true)}};$('#m-imgclr',m).onclick=e=>{e.preventDefault();img='';$('#m-imgnote',m).textContent='Image removed (save to apply).'};
  $('#mf',m).onsubmit=async e=>{e.preventDefault();const f=e.target;const title=f.title.value.trim();if(!title)return toast('Title is required.',true);let slug=slugify(f.slug.value||title);if(C.services.some(x=>x.slug===slug&&x.id!==s.id))slug+='-'+uid().slice(0,3);
   const lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);const pf=f.priceFrom.value.replace(/[^0-9.,]/g,'');
   const o={id:s.id,slug:slug,title:title,icon:f.icon.value,short:f.short.value.trim(),long:f.long.value.trim(),includes:lines(f.includes.value),idealFor:lines(f.idealFor.value),priceFrom:pf,image:img,published:f.published.checked};
   if(isNew)C.services.push(o);else C.services[C.services.findIndex(x=>x.id===s.id)]=o;if(await Admin.persist('Service saved')){closeModal();Admin.view()}}},
 galModal(id){const C=Store.content;const isNew=!id;const g=isNew?{id:uid(),title:'',scene:'office',beforeSrc:'',afterSrc:'',caption:'',published:true}:Object.assign({},C.gallery.find(x=>x.id===id));let b=g.beforeSrc,a=g.afterSrc;
  const m=openModal('<h3>'+(isNew?'Add transformation':'Edit transformation')+'</h3><form id="mf" class="fgrid" novalidate>'+fieldHtml('Title','title',g.title,'text',{full:1})+fieldHtml('Caption','caption',g.caption,'text',{full:1})+'<div class="full"><label class="f" for="m-scene">Placeholder illustration (used when no photos)</label><select class="in" id="m-scene" name="scene">'+['office','bathroom','floor','kitchen','construction'].map(i=>'<option'+(i===g.scene?' selected':'')+'>'+i+'</option>').join('')+'</select></div><div><label class="f">Before photo</label><input type="file" accept="image/*" id="m-b"><div class="note" id="m-bn">'+(b?'Photo set':'None')+'</div></div><div><label class="f">After photo</label><input type="file" accept="image/*" id="m-a"><div class="note" id="m-an">'+(a?'Photo set':'None')+'</div></div><div class="full note">Use two photos taken from the same angle. Both are needed to replace the illustration.</div>'+chk('Published','published',g.published!==false)+'<div class="full" style="display:flex;gap:8px"><button class="btn btn-primary" type="submit">Save</button><button class="btn btn-outline" type="button" id="m-x">Cancel</button></div></form>');
  $('#m-x',m).onclick=closeModal;$('#m-b',m).onchange=async e=>{try{b=await readImage(e.target.files[0],1400);$('#m-bn',m).textContent='Before photo ready'}catch(err){toast(err.message,true)}};$('#m-a',m).onchange=async e=>{try{a=await readImage(e.target.files[0],1400);$('#m-an',m).textContent='After photo ready'}catch(err){toast(err.message,true)}};
  $('#mf',m).onsubmit=async e=>{e.preventDefault();const f=e.target;if(!f.title.value.trim())return toast('Title is required.',true);const o={id:g.id,title:f.title.value.trim(),caption:f.caption.value.trim(),scene:f.scene.value,beforeSrc:b||'',afterSrc:a||'',published:f.published.checked};
   if(isNew)C.gallery.push(o);else C.gallery[C.gallery.findIndex(x=>x.id===g.id)]=o;if(await Admin.persist('Saved')){closeModal();Admin.view()}}},
 tstModal(id){const C=Store.content;const isNew=!id;const t=isNew?{id:uid(),name:'',role:'',rating:5,text:'',placeholder:false,published:true}:Object.assign({},C.testimonials.find(x=>x.id===id));
  const m=openModal('<h3>'+(isNew?'Add testimonial':'Edit testimonial')+'</h3><form id="mf" class="fgrid" novalidate>'+fieldHtml('Customer name','name',t.name)+fieldHtml('Role / location','role',t.role)+areaHtml('Review text','text',t.text,5)+'<div><label class="f" for="m-rating">Rating (0 = hide stars)</label><select class="in" id="m-rating" name="rating">'+[0,1,2,3,4,5].map(i=>'<option'+(i===t.rating?' selected':'')+'>'+i+'</option>').join('')+'</select></div><div></div>'+chk('Sample / placeholder (shows a &ldquo;replace&rdquo; badge)','placeholder',t.placeholder)+chk('Published','published',t.published!==false)+'<div class="full" style="display:flex;gap:8px"><button class="btn btn-primary" type="submit">Save</button><button class="btn btn-outline" type="button" id="m-x">Cancel</button></div></form>');
  $('#m-x',m).onclick=closeModal;
  $('#mf',m).onsubmit=async e=>{e.preventDefault();const f=e.target;if(!f.name.value.trim()||!f.text.value.trim())return toast('Name and review text are required.',true);const o={id:t.id,name:f.name.value.trim(),role:f.role.value.trim(),text:f.text.value.trim(),rating:+f.rating.value,placeholder:f.placeholder.checked,published:f.published.checked};
   if(isNew)C.testimonials.push(o);else C.testimonials[C.testimonials.findIndex(x=>x.id===t.id)]=o;if(await Admin.persist('Saved')){closeModal();Admin.view()}}}
};
document.addEventListener('submit',async e=>{
 if(e.target.id==='set-form'){e.preventDefault();const f=e.target,s=S();['companyName','tagline','tagline2','phone','email','facebookName','facebookUrl','address','mapQuery','serviceAreaNote','googleReviewsUrl'].forEach(k=>s[k]=f[k].value.trim());
  s.whatsapp=digits(f.whatsapp.value);s.serviceAreas=f.serviceAreas.value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(s.email&&!EMAIL_RE.test(s.email))return toast('Please enter a valid email.',true);
  if(await Admin.persist('Settings saved'))Admin.view()}
 else if(e.target.id==='pw-form'){e.preventDefault();const p=$('#pw-new').value;if(p.length<8)return toast('Password must be at least 8 characters.',true);const salt=uid()+uid();ls.set('apex_admin_pw',JSON.stringify({salt:salt,hash:await sha(p,salt)}));$('#pw-new').value='';toast('Password changed')}
});

/* ============================ BOOT ============================ */
(async function boot(){
 await Store.loadContent();
 renderChrome();renderCookie();render();
 if(SBON&&Store.fetchRemote){Store.fetchRemote.then(r=>{if(r){const before=JSON.stringify(Store.content);Store.content=Store.merge(r);if(JSON.stringify(Store.content)!==before&&getPath()!=='/admin'&&!document.activeElement.closest('form')){renderChrome();render()}}})}
})();
window.__apex={Store:Store,Admin:Admin,CFG:CFG};
})();
</script>
